spring:
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    # No lazy loading in the controller and during JSON serialization (the session is closed after the service)
    open-in-view: false

logging:
  level:
    # SQL sent to the database (in tests: target/surefire-reports/*-output.txt)
    org.hibernate.SQL: debug
